server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Inherited by the locations below (none of them sets its own add_header).
  # 'unsafe-inline' styles: Mantine injects its CSS variables in a <style> tag.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Same origin for SPA and API: no CORS needed
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback for client-side routes
  location / {
    try_files $uri /index.html;
  }
}
